name: Build and publish GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type: major, minor, patch"
        required: true
        default: "minor"

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read
  deployments: write

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Lint, typecheck, and test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Yarn Classic
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn tsc --noEmit

  scores:
    runs-on: ubuntu-latest
    name: Quality scores
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Yarn Classic
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: React Doctor
        run: |
          set -o pipefail
          yarn doctor 2>&1 | tee doctor.txt

      - name: aislop
        run: |
          set -o pipefail
          yarn aislop 2>&1 | tee aislop.txt

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Quality scores"
            echo
            echo "This job fails the check. \`yarn doctor\` exits non-zero on any finding and does not call the score API. \`yarn aislop\` exits non-zero when the score is below \`ci.failBelow\` (96) or an error-severity finding is present."
            echo
            echo "### react-doctor"
            echo
            echo '```text'
            cat doctor.txt || true
            echo '```'
            echo
            echo "### aislop"
            echo
            echo '```text'
            cat aislop.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [checks, scores]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Publish to GitHub Pages
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Yarn Classic
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build project
        run: yarn build
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
          VITE_REDIRECT_TARGET: ${{ vars.VITE_REDIRECT_TARGET }}

      - name: Write quality score badges
        continue-on-error: true
        run: node scripts/quality-badges.mjs --out dist/badges

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Increment the version
      - name: Bump version and push tag
        id: bump_version
        uses: anothrNick/github-tag-action@1.67.0
        env:
          VERBOSE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_API_TAGGING: false # uses git cli
          WITH_V: true
          DEFAULT_BUMP: ${{ github.event.inputs.bump }}

      # actions/create-release is archived and has no release that runs on
      # current GitHub-hosted runners. gh is already on the runner.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.bump_version.outputs.new_tag }}
        run: |
          notes=$(printf '%s\n' "Changes in this release:" "- See GitHub")
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Release ${RELEASE_TAG}" \
            --notes "$notes" \
            --verify-tag

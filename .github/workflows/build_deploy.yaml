name: Build and Publish Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type: major, minor, patch"
        required: true
        default: "minor"

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read
  deployments: write

jobs:
  scores:
    runs-on: ubuntu-latest
    name: Quality scores
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Yarn Classic
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: React Doctor
        id: doctor
        continue-on-error: true
        run: yarn doctor 2>&1 | tee doctor.txt

      - name: aislop
        id: aislop
        continue-on-error: true
        run: yarn aislop 2>&1 | tee aislop.txt

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Quality scores"
            echo
            echo "Advisory only. \`continue-on-error\` is set on both scans, so a low score or a non-zero exit does not fail this workflow."
            echo
            echo "react-doctor is \`yarn doctor\` (\`--no-score --no-supply-chain --blocking none\`). \`--no-score\` skips the score API, so this job has no numeric react-doctor score. aislop is \`yarn aislop\` (\`aislop scan\`) with \`ci.failBelow: 0\`."
            echo
            echo "### react-doctor"
            echo
            echo '```text'
            cat doctor.txt || true
            echo '```'
            echo
            echo "### aislop"
            echo
            echo '```text'
            cat aislop.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Publish to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Run your build step here if needed, e.g., for a React app
      - name: Install dependencies
        run: npm install
        working-directory: ./

      - name: Build project
        run: npm run build
        working-directory: ./
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{secrets.VITE_SPOTIFY_CLIENT_ID}}
          VITE_REDIRECT_TARGET: ${{vars.VITE_REDIRECT_TARGET}}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          directory: ./dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Increment the version
      - name: Bump version and push tag
        id: bump_version
        uses: anothrNick/github-tag-action@1.67.0
        env:
          VERBOSE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_API_TAGGING: false # uses git cli
          WITH_V: true
          DEFAULT_BUMP: ${{ github.event.inputs.bump }}

      # Create a GitHub release
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.bump_version.outputs.new_tag }}
          release_name: Release ${{ steps.bump_version.outputs.new_tag }}
          body: |
            Changes in this release:
            - See GitHub
          draft: false
          prerelease: false
